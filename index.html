<body class="h-full bg-gray-50 font-main text-gray-700">
  <div class="h-full w-full flex overflow-hidden">
    <aside class="w-60 min-w-[240px] bg-white border-r border-gray-100 flex flex-col h-full min-h-0 overflow-y-auto">
      <div class="p-4 border-b border-gray-100 shrink-0"><h1 class="text-lg font-bold text-lila-500 flex items-center gap-2"><i data-lucide="wallet" class="w-5 h-5"></i><span>Mi plan de pagos</span></h1></div>

      </nav>
      <div class="shrink-0 m-2 rounded-2xl bg-lila-50/75 border border-lila-100 p-3.5">

function getMonthlyDashboardItems(){
  const {all}=getBiweeklyItems(state.currentMonth,state.currentYear);

  return all.map(item=>{
    const q1=getAmountToSetAside(item,1);
    const q2=getAmountToSetAside(item,2);
    const plan=q1+q2;
    if(plan<=0)return null;

    const apart1=getRealSetAsideAmount(item,1);
    const apart2=getRealSetAsideAmount(item,2);
    const apart=apart1+apart2;

    const q1Payable=shouldShowPaidCheckbox(item,1,state.currentMonth,state.currentYear);
    const q2Payable=shouldShowPaidCheckbox(item,2,state.currentMonth,state.currentYear);

    const pay1=q1Payable?getPaymentPlanAmountForQ(item,1):0;
    const pay2=q2Payable?getPaymentPlanAmountForQ(item,2):0;
    const paid1=q1Payable&&isPaidForQuincena(item,1)?pay1:0;
    const paid2=q2Payable&&isPaidForQuincena(item,2)?pay2:0;

    const qs=[];
    if(q1>0)qs.push('Q1');
    if(q2>0)qs.push('Q2');

    const dates=[];
    if(q1>0)dates.push(getPaymentDueLabel(item,1,state.currentMonth,state.currentYear));
    if(q2>0)dates.push(getPaymentDueLabel(item,2,state.currentMonth,state.currentYear));

    return {
      item,
      concept:getPaymentCollection(item)==='installments'
        ? (q1>0&&q2>0?item.concept:(q1>0?getInstallmentDisplayConcept(item,1):getInstallmentDisplayConcept(item,2)))
        : item.concept,
      type:getPaymentType(item),
      category:getCategoryVisual(getPaymentType(item)),
      plan,
      apart,
      payTarget:pay1+pay2,
      paid:paid1+paid2,
      qLabel:qs.join(' + '),
      dateLabel:[...new Set(dates)].join(' · ')
    };
  }).filter(Boolean);
}

  const totalApart=rowsAll.reduce((s,r)=>s+r.apart,0);
  const totalPayTarget=rowsAll.reduce((s,r)=>s+r.payTarget,0);

function getSetAsideSummaryForCollection(collection,m=state.currentMonth,y=state.currentYear){
  const p=getPaymentsForMonth(m,y);
  const map={fixed:p.fixed,installments:p.inst,variable:p.vari};
  const arr=map[collection]||[];
  const q1Plan=arr.reduce((s,i)=>s+getAmountToSetAside(i,1),0);
  const q2Plan=arr.reduce((s,i)=>s+getAmountToSetAside(i,2),0);
  const q1Apart=arr.reduce((s,i)=>s+(isSetAside(i,1)?getAmountToSetAside(i,1):0),0);
  const q2Apart=arr.reduce((s,i)=>s+(isSetAside(i,2)?getAmountToSetAside(i,2):0),0);
  let prevQ2Plan=0,prevQ2Apart=0;
  if(collection==='installments'){
    const prev=addMonthOffset(m,y,-1);
    (state.installments||[]).forEach(item=>{
      if(getSplitMode(item)!=='Q2 anterior + Q1 del mes de pago')return;
      if(!isInstallmentActiveInMonth(item,m,y))return;
      const temp={...item,__collection:'installments',__viewMonth:prev.month,__viewYear:prev.year};
      const amount=getAmountToSetAside(temp,2);
      if(amount<=0)return;
      const status=getInstallmentStatus(item,prev.month,prev.year);
      prevQ2Plan+=amount;
      if(status.apartadoQ2)prevQ2Apart+=amount;
    });
  }
  const totalPlan=q1Plan+q2Plan+prevQ2Plan;
  const totalApart=q1Apart+q2Apart+prevQ2Apart;
  return {q1Plan,q2Plan,q1Apart,q2Apart,prevQ2Plan,prevQ2Apart,totalPlan,totalApart,missing:Math.max(0,totalPlan-totalApart)};
}
function renderSetAsideMiniSummary(collection){
  const s=getSetAsideSummaryForCollection(collection);
  const pct=s.totalPlan?Math.round((s.totalApart/s.totalPlan)*100):100;
  const hasPrevQ2=collection==='installments' && s.prevQ2Plan>0;
  const grid=hasPrevQ2?'grid-cols-5':'grid-cols-4';
  const prevCard=hasPrevQ2?`<div class="bg-lila-50 rounded-xl p-2"><span class="text-gray-400">Q2 anterior</span><div class="font-bold text-lila-500">${fmt(s.prevQ2Apart)}</div><div class="text-[10px] text-gray-400">de ${fmt(s.prevQ2Plan)}</div></div>`:'';
  return `<div class="bg-white border border-gray-100 rounded-2xl card-shadow p-3 mb-4">
    <div class="flex items-center justify-between gap-3 mb-2">
      <div class="flex items-center gap-2 font-bold text-gray-800"><i data-lucide="piggy-bank" class="w-4 h-4 text-azul-500"></i>Apartado de esta categoría</div>
      <div class="text-xs font-semibold ${s.missing<=0?'text-menta-500':'text-red-400'}">${s.missing<=0?'Apartado completo':`Faltan ${fmt(s.missing)}`}</div>
    </div>
    <div class="grid ${grid} gap-3 text-xs">
      <div class="bg-azul-50 rounded-xl p-2"><span class="text-gray-400">Q1 apartado</span><div class="font-bold text-azul-500">${fmt(s.q1Apart)}</div><div class="text-[10px] text-gray-400">de ${fmt(s.q1Plan)}</div></div>
      <div class="bg-azul-50 rounded-xl p-2"><span class="text-gray-400">Q2 actual</span><div class="font-bold text-azul-500">${fmt(s.q2Apart)}</div><div class="text-[10px] text-gray-400">de ${fmt(s.q2Plan)}</div></div>
      ${prevCard}
      <div class="bg-menta-50 rounded-xl p-2"><span class="text-gray-400">Total apartado</span><div class="font-bold text-menta-500">${fmt(s.totalApart)}</div><div class="text-[10px] text-gray-400">${pct}% del plan</div></div>
      ${s.missing<=0
        ? `<div class="bg-azul-50 rounded-xl p-2"><span class="text-gray-400">Apartado completo</span><div class="mt-1"><span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-white/70 text-azul-500 border border-azul-100"><i data-lucide="wallet" class="w-3.5 h-3.5"></i></span></div><div class="text-[10px] text-azul-500 font-medium">sin pendientes</div></div>`
        : `<div class="bg-red-50 rounded-xl p-2"><span class="text-gray-400">Falta apartar</span><div class="font-bold text-red-400">${fmt(s.missing)}</div><div class="text-[10px] text-gray-400">pendiente</div></div>`}
    </div>
    ${hasPrevQ2?'<div class="text-[10px] text-gray-400 mt-2">Incluye Q2 del mes anterior cuando el pago se cubre con Q2 anterior + Q1 del mes de pago.</div>':''}
  </div>`;
}
function makeSavingsPlanningItems(p){
  const activeGoalIds=new Set((p.goals||[]).map(g=>g.goalId||g.id).filter(Boolean));
  return (p.sav||[]).filter(s=>!s.goalId||!activeGoalIds.has(s.goalId)).map(s=>({
    ...s,
    __collection:'savings',
    concept:(state.savingsGoals||[]).find(g=>g.id===s.goalId)?.name?`Ahorro: ${(state.savingsGoals||[]).find(g=>g.id===s.goalId).name}`:'Ahorro general',
    type:'ahorro',
    paid:false,
    displayAmount:getSavingPlannedAmount(s)
  }));
}
function getPlanTotal(arr){return (arr||[]).reduce((s,i)=>s+getAmountToSetAside(i,1)+getAmountToSetAside(i,2),0);}
function getApartTotal(arr){return (arr||[]).reduce((s,i)=>s+getRealSetAsideAmount(i,1)+getRealSetAsideAmount(i,2),0);}
function getBiweeklyItems(m=state.currentMonth,y=state.currentYear){
  const p=getPaymentsForMonth(m,y);
  const savingsItems=makeSavingsPlanningItems(p);
  return {p,all:[...p.fixed,...p.inst,...p.vari,...(p.goals||[]),...savingsItems]};

function toggleApartado(id,col,q){
  if(col==='goalContrib'){
    const goal=(state.savingsGoals||[]).find(g=>g.id===id);
    if(!goal)return;
    const target=q===1?'Q1':'Q2';
    const existing=state.savings.find(s=>s.goalId===id&&s.month===state.currentMonth&&s.year===state.currentYear&&normalizeQuincena(s.quincena,s.date)===target);
    if(existing){
      state.savings=state.savings.filter(s=>s.id!==existing.id);
    }else{
      const amount=getGoalContributionAmount(goal,q);
      if(amount>0){state.savings.push({id:uid(),date:q===1?(state.config.payDate1||1):(state.config.payDate2||16),quincena:target,amount,card:goal.card||'',goalId:id,month:state.currentMonth,year:state.currentYear});}
    }
    saveState();render();return;
  }
  const item=state[col].find(i=>i.id===id);if(!item)return;if(col==='fixed'){const s=getFixedStatus(item);if(q===1)s.apartadoQ1=!s.apartadoQ1;else s.apartadoQ2=!s.apartadoQ2;}else if(col==='installments'){const s=getInstallmentStatus(item);if(q===1)s.apartadoQ1=!s.apartadoQ1;else s.apartadoQ2=!s.apartadoQ2;}else{if(q===1)item.apartadoQ1=!item.apartadoQ1;else item.apartadoQ2=!item.apartadoQ2;}saveState();render();}
function togglePaid(id,col,q=null){
  if(col==='goalContrib')return;
  const item=state[col].find(i=>i.id===id);
  if(!item)return;
  const plan=getPaymentPlan(item);
  const isSplitPaid=plan==='Pagar mitad en Q1 y mitad en Q2'||plan==='Dividir en varias quincenas de pago';
  if(isSplitPaid&&q){
    if(col==='fixed'){
      const s=getFixedStatus(item); if(q===1)s.paidQ1=!s.paidQ1; else s.paidQ2=!s.paidQ2;
      s.paid=!!(s.paidQ1&&s.paidQ2);
    }else if(col==='installments'){
      const s=getInstallmentStatus(item); if(q===1)s.paidQ1=!s.paidQ1; else s.paidQ2=!s.paidQ2;
      s.paid=!!(s.paidQ1&&s.paidQ2);
    }else{
      if(q===1)item.paidQ1=!item.paidQ1; else item.paidQ2=!item.paidQ2;
      item.paid=!!(item.paidQ1&&item.paidQ2);
    }
  }else if(col==='fixed'){
    const s=getFixedStatus(item);s.paid=!s.paid;
  }else if(col==='installments'){
    const s=getInstallmentStatus(item);s.paid=!s.paid;
  }else item.paid=!item.paid;
  saveState();render();
}
function getCalendarItemsForDay(day){
  const p=getPaymentsForMonth(state.currentMonth,state.currentYear),items=[];

  const addPayments=(arr,type,label)=>arr.forEach(item=>{
    [1,2].forEach(q=>{
      const apartAmount=getAmountToSetAside(item,q);
      if(apartAmount<=0)return;

      const due=getRealPaymentMonthYearForQuincena(item,q,state.currentMonth,state.currentYear);
      if(due.month!==state.currentMonth||due.year!==state.currentYear)return;

      const realDay=getRealPaymentDayForQuincena(item,q);
      if(realDay!==day)return;

      const col=getPaymentCollection(item);
      const payAmount=getPaymentPlanAmountForQ(item,q);
      const displayAmount=payAmount>0?payAmount:apartAmount;
      const status=getPaymentStatusForQuincena(item,q);

      items.push({
        id:item.id,
        raw:item,
        col,
        q,
        concept:item.concept||item.notes||'Registro',
        type,
        label,
        card:getExpenseAccountName(item)||'-',
        amount:displayAmount,
        apartAmount,
        status,
        canApart:col!=='savings',
        canPay:shouldShowPaidCheckbox(item,q,state.currentMonth,state.currentYear),
        apartado:isSetAside(item,q),
        pagado:isPaidForQuincena(item,q),
        dueDay:realDay,
        dueMonth:due.month,
        dueYear:due.year
      });
    });
  });

  addPayments(p.fixed,'fijo','Pago fijo');
  // Pagos a meses: buscar por fecha real de cada cuota, aunque la cuota financiera pertenezca a otro ciclo/mes.
  (state.installments||[]).forEach(base=>{
    const targets=getPaymentPlan(base)==='Dividir en varias quincenas de pago'?getInstallmentPaymentTargets(base):[];
    if(targets.length){
      targets.forEach(t=>{
        if(isInstallmentTargetCancelledByLiquidation(base,t.q,t.month,t.year))return;
        const [dy,dm,dd]=String(t.date||'').split('-').map(Number);
        if(dy!==state.currentYear||dm-1!==state.currentMonth||dd!==day)return;
        const view={...base,__collection:'installments',__viewMonth:t.month,__viewYear:t.year,month:t.month,year:t.year};
        const s=getInstallmentStatus(base,t.month,t.year);view.paidQ1=!!s.paidQ1;view.paidQ2=!!s.paidQ2;view.apartadoQ1=!!s.apartadoQ1;view.apartadoQ2=!!s.apartadoQ2;
        items.push({id:base.id,raw:view,col:'installments',q:t.q,concept:getInstallmentDisplayConcept(view,t.q,t.month,t.year),type:'meses',label:'Pago a meses',card:getExpenseAccountName(base)||'-',amount:parseFloat(t.amount)||0,apartAmount:getAmountToSetAside(view,t.q),status:getPaymentStatusForQuincena(view,t.q),canApart:true,canPay:true,apartado:isSetAside(view,t.q),pagado:isPaidForQuincena(view,t.q),dueDay:dd,dueMonth:dm-1,dueYear:dy});
      });
    }else addPayments(getPaymentsForMonth(state.currentMonth,state.currentYear).inst.filter(x=>x.id===base.id),'meses','Pago a meses');
    if(isInstallmentLiquidated(base)&&base.liquidation.source==='savings'){
      const [ly,lm,ld]=String(base.liquidation.date||'').split('-').map(Number);
      if(ly===state.currentYear&&lm-1===state.currentMonth&&ld===day)items.push({id:base.id,raw:base,col:'liquidationSavings',q:0,concept:`${base.concept} · Liquidación`,type:'meses',label:'Liquidación anticipada',card:'Ahorro general',amount:parseFloat(base.liquidation.amount)||0,apartAmount:0,status:'pagado',canApart:false,canPay:false,apartado:true,pagado:true,dueDay:ld,dueMonth:lm-1,dueYear:ly});
    }
  });
  addPayments(p.vari,'variado','Pago variado');
  addPayments(p.goals||[],'ahorro','Ahorro');

  return items.sort((a,b)=>a.concept.localeCompare(b.concept,'es'));
}

function calendarItemPassesFilter(item){
  if(calendarFilter==='pending')return item.status==='pendiente';
  if(calendarFilter==='apartado')return item.status==='apartado';
  if(calendarFilter==='pagado')return item.status==='pagado';
  return true;
}

function getCalendarCobrosForDay(day){
  const result=[];
  [1,2].forEach(q=>{
    const iso=getPayrollDate(q,state.currentMonth,state.currentYear);
    const [y,m,d]=String(iso||'').split('-').map(Number);
    if(y===state.currentYear && m===state.currentMonth+1 && d===day){
      result.push({q,date:iso,amount:getBiweeklyAvailableIncome(q,state.currentMonth,state.currentYear)});
    }
  });

  const next=addMonthOffset(state.currentMonth,state.currentYear,1);
  const nextQ1=getPayrollDate(1,next.month,next.year);
  const [ny,nm,nd]=String(nextQ1||'').split('-').map(Number);
  if(ny===state.currentYear && nm===state.currentMonth+1 && nd===day){
    result.push({q:1,date:nextQ1,amount:(state.config.salaryBiweekly||0),nextMonth:true});
  }
  return result;
}

  calendarFilter=filter;
  renderMiniCalendar();
  renderCalendarDayDetail();

  lucide.createIcons();

function selectCalendarDay(day){
  selectedCalendarDay=day;
  renderMiniCalendar();
  renderCalendarDayDetail();
  renderCalendarCycleAgenda();
  lucide.createIcons();
}

function getSelectedCalendarDay(){
  const days=getDaysInMonth(state.currentMonth,state.currentYear);
  if(selectedCalendarDay && selectedCalendarDay>=1 && selectedCalendarDay<=days)return selectedCalendarDay;

  const today=new Date();
  if(today.getFullYear()===state.currentYear && today.getMonth()===state.currentMonth){
    selectedCalendarDay=today.getDate();
    return selectedCalendarDay;
  }

  for(let d=1;d<=days;d++){
    if(getCalendarItemsForDay(d).some(calendarItemPassesFilter)){
      selectedCalendarDay=d;
      return d;
    }
  }

  selectedCalendarDay=1;
  return 1;
}

}

function renderMiniCalendar(){
  const m=state.currentMonth,y=state.currentYear;
  const today=new Date(),todayDay=today.getDate(),todayMonth=today.getMonth(),todayYear=today.getFullYear();
  const days=getDaysInMonth(m,y),first=getFirstDayOfMonth(m,y);
  const selected=getSelectedCalendarDay();

  const title=document.getElementById('miniCalTitle');
  if(title)title.textContent=`${MONTHS[m]} ${y}`;
  renderCalendarFilters();

  let html='<div class="grid grid-cols-7 gap-1">';
  DAYS.forEach(d=>html+=`<div class="text-center text-[10.5px] font-semibold text-gray-400 py-1.5">${d}</div>`);
  for(let i=0;i<first;i++)html+='<div></div>';

  for(let d=1;d<=days;d++){
    const rawItems=getCalendarItemsForDay(d);
    const items=rawItems.filter(calendarItemPassesFilter);
    const cobros=getCalendarCobrosForDay(d);
    const isToday=d===todayDay&&m===todayMonth&&y===todayYear;
    const isSelected=d===selected;

    const statuses=new Set(items.map(i=>i.status));
    let dots='<div class="flex gap-1 justify-center min-h-[9px] mt-1.5">';
    if(cobros.length)dots+='<span class="w-1.5 h-1.5 rounded-full bg-lila-400"></span>';
    if(statuses.has('pendiente'))dots+='<span class="w-1.5 h-1.5 rounded-full bg-red-400"></span>';
    if(statuses.has('apartado'))dots+='<span class="w-1.5 h-1.5 rounded-full bg-azul-400"></span>';
    if(statuses.has('pagado'))dots+='<span class="w-1.5 h-1.5 rounded-full bg-menta-400"></span>';
    dots+='</div>';

    const total=items.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
    const amountLabel=items.length?`<div class="text-[8.5px] font-semibold text-gray-500 mt-1 truncate">${fmt(total)}</div>`:'<div class="h-[14px]"></div>';
    const countLabel=items.length>1?`<div class="text-[8px] text-gray-400 mt-0.5 leading-none">${items.length} pagos</div>`:'<div class="h-[11px]"></div>';

    html+=`
      <button onclick="selectCalendarDay(${d})" class="min-h-[82px] rounded-xl border px-1.5 py-2 text-center transition
        ${isSelected?'bg-lila-50 border-lila-200 ring-2 ring-lila-100':
          isToday?'bg-white border-lila-200':
          (items.length||cobros.length)?'bg-white border-gray-100 hover:bg-gray-50':'bg-gray-50/40 border-transparent hover:bg-gray-50'}">
        <div class="flex items-center justify-center gap-1">
          <span class="text-[12.5px] ${isSelected?'font-extrabold text-lila-600':isToday?'font-extrabold text-lila-500':'text-gray-600'}">${d}</span>
          ${cobros.length?'<i data-lucide="wallet" class="w-2.5 h-2.5 text-lila-500"></i>':''}
        </div>
        ${dots}
        ${amountLabel}
        ${countLabel}
      </button>`;
  }

  html+='</div>';
  const el=document.getElementById('miniCalendar');
  if(el)el.innerHTML=html;
}

function getCalendarCycleForDay(day){
  const iso=isoDate(state.currentYear,state.currentMonth,day);
  const key=isoDateKey(iso);

  const c1=getDashboardQuincenaCycle(1,state.currentMonth,state.currentYear);
  const c2=getDashboardQuincenaCycle(2,state.currentMonth,state.currentYear);

  if(key>=isoDateKey(c1.start) && key<isoDateKey(c1.end))return {q:1,...c1};
  if(key>=isoDateKey(c2.start) && key<isoDateKey(c2.end))return {q:2,...c2};

  return day<(parseInt(String(c2.start).split('-')[2])||15)?{q:1,...c1}:{q:2,...c2};
}

function getCycleAgendaItems(q){
  const {all}=getBiweeklyItems(state.currentMonth,state.currentYear);
  return all.filter(item=>getAmountToSetAside(item,q)>0).map(item=>{
    const due=getRealPaymentMonthYearForQuincena(item,q,state.currentMonth,state.currentYear);
    const day=getRealPaymentDayForQuincena(item,q);
    const col=getPaymentCollection(item);
    const status=getPaymentStatusForQuincena(item,q);
    const amount=getPaymentPlanAmountForQ(item,q)>0?getPaymentPlanAmountForQ(item,q):getAmountToSetAside(item,q);
    return {item,col,q,day,month:due.month,year:due.year,status,amount,concept:getPaymentCollection(item)==='installments'?getInstallmentDisplayConcept(item,q):item.concept||'Registro'};
  }).sort((a,b)=>monthIndex(a.month,a.year)-monthIndex(b.month,b.year)||a.day-b.day);
}

    const apartado=getApartTotal([...p.fixed,...p.inst,...p.vari]);
    const pending=Math.max(0,payments-apartado);
    return { name, month, income, fixed, inst, vari, sav, payments, out, free, used, paid, apartado, pending, health:getMonthlyHealth(free,used) };
  });
}

function getMonthlyBoardRows(m=state.currentMonth,y=state.currentYear){
  const {all}=getBiweeklyItems(m,y);
  return all.map(item=>{
    const col=getPaymentCollection(item);
    const type=getPaymentType(item);
    const category=getCategoryVisual(type);
    const qList=[1,2].filter(q=>getAmountToSetAside({...item,__viewMonth:m,__viewYear:y},q)>0);
    if(!qList.length)return null;
    const plan=qList.reduce((s,q)=>s+getAmountToSetAside({...item,__viewMonth:m,__viewYear:y},q),0);
    const apart=qList.reduce((s,q)=>s+getRealSetAsideAmount({...item,__viewMonth:m,__viewYear:y},q),0);
    // El ahorro solo se APARTA: nunca participa como "pagado" en la vista mensual.
    const isSavingsOnly=col==='goalContrib'||col==='savings'||type==='ahorro';
    const payableQs=isSavingsOnly?[]:qList.filter(q=>shouldShowPaidCheckbox({...item,__viewMonth:m,__viewYear:y},q,m,y));
    const payTarget=payableQs.reduce((s,q)=>s+getPaymentPlanAmountForQ({...item,__viewMonth:m,__viewYear:y},q),0);
    const paid=payableQs.reduce((s,q)=>s+(isPaidForQuincena({...item,__viewMonth:m,__viewYear:y},q)?getPaymentPlanAmountForQ({...item,__viewMonth:m,__viewYear:y},q):0),0);
    const apartComplete=qList.every(q=>isSetAside({...item,__viewMonth:m,__viewYear:y},q));
    const canPay=payableQs.length>0;
    const paidComplete=canPay&&payableQs.every(q=>isPaidForQuincena({...item,__viewMonth:m,__viewYear:y},q));
    const status=isSavingsOnly?(apartComplete?'apartado':'pendiente'):(paidComplete&&payTarget>0?'pagado':apartComplete?'apartado':'pendiente');
    const dueLabels=[...new Set(qList.map(q=>getPaymentDueLabel({...item,__viewMonth:m,__viewYear:y},q,m,y)))];
    const qLabel=qList.map(q=>`Q${q}`).join(' + ');
    const concept=col==='installments'
      ? (qList.length===1?getInstallmentDisplayConcept(item,qList[0]):(item.concept||'Pago a meses'))
      : (item.concept||'Registro');
    let account='';
    if(col==='installments') account=item.purchaseCard||item.card||'';
    else if(col==='goalContrib') account=item.card||'Ahorro';
    else account=item.card||'';
    return {
      id:item.id,
      col,
      item,
      concept,
      type,
      category,
      qList,
      qLabel,
      account:account||'Sin cuenta',
      dateLabel:dueLabels.join(' · '),
      plan,apart,payTarget,paid,
      apartComplete,
      paidComplete,
      canPay,
      status
    };
  }).filter(Boolean).sort((a,b)=>{
    // Orden principal del desglose mensual:
    // 1) pagos a meses, 2) pagos fijos, 3) variados, 4) ahorro.
    const priority={installments:0,fixed:1,variable:2,goalContrib:3,savings:3};
    const ap=priority[a.col]??9;
    const bp=priority[b.col]??9;
    if(ap!==bp)return ap-bp;
    // Dentro de cada tipo, primero lo que vence antes y luego alfabéticamente.
    const aKey=parseInt((a.dateLabel||'').match(/\d+/)?.[0]||'99');
    const bKey=parseInt((b.dateLabel||'').match(/\d+/)?.[0]||'99');
    return aKey-bKey || String(a.concept).localeCompare(String(b.concept),'es');
  });
}
function toggleMonthlyBoardApart(id,col){

function setApartStateDirect(id,col,q,value,m=state.currentMonth,y=state.currentYear){
  if(col==='goalContrib'){
    const goal=(state.savingsGoals||[]).find(g=>g.id===id);if(!goal)return;
    const target=q===1?'Q1':'Q2';
    const existing=state.savings.find(s=>s.goalId===id&&s.month===m&&s.year===y&&normalizeQuincena(s.quincena,s.date)===target);
    if(value&&!existing){const amount=getGoalContributionAmount(goal,q);if(amount>0)state.savings.push({id:uid(),date:q===1?(state.config.payDate1||1):(state.config.payDate2||16),quincena:target,amount,card:goal.card||'',goalId:id,month:m,year:y,confirmed:true});}
    if(!value&&existing)state.savings=state.savings.filter(s=>s.id!==existing.id);
    return;
  }
  if(col==='savings'){
    const s=state.savings.find(x=>x.id===id);if(!s)return;
    if(value&&!(parseFloat(s.amount)>0))s.amount=getSavingPlannedAmount(s);
    s.confirmed=!!value;return;
  }
  const item=(state[col]||[]).find(i=>i.id===id);if(!item)return;
  if(col==='fixed'){const st=getFixedStatus(item,m,y);if(q===1)st.apartadoQ1=!!value;else st.apartadoQ2=!!value;}
  else if(col==='installments'){const st=getInstallmentStatus(item,m,y);if(q===1)st.apartadoQ1=!!value;else st.apartadoQ2=!!value;}
  else {if(q===1)item.apartadoQ1=!!value;else item.apartadoQ2=!!value;}
}
function setPaidStateDirect(id,col,q,value,m=state.currentMonth,y=state.currentYear){
  if(col==='goalContrib'||col==='savings')return;
  const item=(state[col]||[]).find(i=>i.id===id);if(!item)return;
  const plan=getPaymentPlan(item),split=plan==='Pagar mitad en Q1 y mitad en Q2'||plan==='Dividir en varias quincenas de pago';
  if(col==='fixed'||col==='installments'){
    const st=col==='fixed'?getFixedStatus(item,m,y):getInstallmentStatus(item,m,y);
    if(split){if(q===1)st.paidQ1=!!value;else st.paidQ2=!!value;const view={...item,__collection:col,__viewMonth:m,__viewYear:y};const payable=[1,2].filter(x=>shouldShowPaidCheckbox(view,x,m,y));st.paid=payable.length>0&&payable.every(x=>x===1?!!st.paidQ1:!!st.paidQ2);}else st.paid=!!value;
  }else{
    if(split){if(q===1)item.paidQ1=!!value;else item.paidQ2=!!value;const view={...item,__collection:'variable',__viewMonth:m,__viewYear:y};const payable=[1,2].filter(x=>shouldShowPaidCheckbox(view,x,m,y));item.paid=payable.length>0&&payable.every(x=>x===1?!!item.paidQ1:!!item.paidQ2);}else item.paid=!!value;
  }
}
function setMonthlyBoardAllApart(value){
  getMonthlyBoardRows().forEach(r=>r.qList.forEach(q=>setApartStateDirect(r.id,r.col,q,!!value,state.currentMonth,state.currentYear)));

}

function getBiweeklyHealth(free, usedPct){
  if (free < 0) return { label:'Revisar', cls:'bg-red-50 text-red-500 border-red-100', dot:'bg-red-400', note:'quincena pesada' };
  if (usedPct >= 85) return { label:'Justa', cls:'bg-durazno-50 text-durazno-500 border-durazno-100', dot:'bg-durazno-400', note:'poco margen libre' };
  if (usedPct >= 55) return { label:'Estable', cls:'bg-rosa-50 text-rosa-500 border-rosa-100', dot:'bg-rosa-400', note:'controlada' };
  return { label:'Saludable', cls:'bg-aqua-50 text-aqua-500 border-aqua-200', dot:'bg-aqua-500', note:'buen margen libre' };
}
function getYearBiweeklyData(){
  const salary = state.config.salaryBiweekly || 0;
  return MONTHS.map((name,month)=>{
    const {p,all}=getBiweeklyItems(month,state.currentYear);
    const q1=getBiweeklyPlannedTotal(1,month,state.currentYear), q2=getBiweeklyPlannedTotal(2,month,state.currentYear);
    const q1Apart=getBiweeklyApartedTotal(1,month,state.currentYear), q2Apart=getBiweeklyApartedTotal(2,month,state.currentYear);
    const s1=getSavingsByQuincena(p,1), s2=getSavingsByQuincena(p,2);
    const free1=getBiweeklyFreeAmount(1,month,state.currentYear), free2=getBiweeklyFreeAmount(2,month,state.currentYear);
    const used1=salary>0?Math.min(140,Math.round((Math.max(q1,q1Apart)/salary)*100)):0;
    const used2=salary>0?Math.min(140,Math.round((Math.max(q2,q2Apart)/salary)*100)):0;
    return { name, month, q1, q2, s1, s2, free1, free2, used1, used2, h1:getBiweeklyHealth(free1,used1), h2:getBiweeklyHealth(free2,used2) };
  });
}

function renderFixedView(){

  const paidActive=active.filter(i=>getFixedStatus(i,state.currentMonth,state.currentYear).paid).reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  const pendingPay=Math.max(0,totalActive-paidActive);
  const apartSummary=getSetAsideSummaryForCollection('fixed');

  const itemStatus=item=>{
    const activeNow=isFixedActiveInMonth(item,state.currentMonth,state.currentYear);
    const st=getFixedStatus(item,state.currentMonth,state.currentYear);
    if(!activeNow)return 'inactive';
    if(st.paid)return 'pagado';
    if(st.apartadoQ1||st.apartadoQ2)return 'apartado';
    return 'pendiente';
  };
  const statusVisual=status=>{
    if(status==='inactive')return {label:'Inactivo',bg:'bg-gray-50',border:'border-gray-100',text:'text-gray-400'};
    return getStatusVisual(status);

  const counts={
    all:items.length,

    apartado:active.filter(i=>itemStatus(i)==='apartado').length,
    pagado:active.filter(i=>itemStatus(i)==='pagado').length
  };

function openLiquidateInstallmentModal(id){
  const item=(state.installments||[]).find(i=>i.id===id);if(!item)return;
  if(isInstallmentLiquidated(item))return;
  const remaining=getInstallmentRemainingAmount(item);
  const today=isoDate(state.currentYear,state.currentMonth,Math.min(new Date().getDate(),getDaysInMonth(state.currentMonth,state.currentYear)));
  document.getElementById('modalContent').innerHTML=`<div class="p-5"><div class="flex justify-between gap-3 mb-4"><div><h3 class="font-bold text-gray-800 flex items-center gap-2"><i data-lucide="badge-check" class="w-5 h-5 text-menta-500"></i>Liquidar deuda</h3><p class="text-xs text-gray-400 mt-1">${escapeHtml(item.concept)} · saldo pendiente ${fmt(remaining)}</p></div><button onclick="closeModal()" class="text-xl text-gray-400">×</button></div><form class="space-y-4" onsubmit="saveInstallmentLiquidation(event,'${item.id}')"><div class="bg-menta-50 border border-menta-100 rounded-xl p-3 text-xs text-gray-600"><b>Esto no cambia las fechas originales.</b> Las cuotas futuras quedarán canceladas por liquidación anticipada y conservarás el historial.</div><div class="grid grid-cols-2 gap-3"><div><label class="block text-xs mb-1 font-semibold text-gray-600">Fecha de liquidación</label><input type="date" name="liquidationDate" value="${today}" required class="w-full border rounded-lg px-3 py-2 text-sm"></div><div><label class="block text-xs mb-1 font-semibold text-gray-600">Monto liquidado</label><input type="number" step="any" min="0" name="liquidationAmount" value="${remaining.toFixed(2)}" required class="w-full border rounded-lg px-3 py-2 text-sm"></div></div><div><label class="block text-xs mb-1 font-semibold text-gray-600">¿De dónde salió el dinero?</label><select name="liquidationSource" class="w-full border rounded-lg px-3 py-2 text-sm"><option value="q1">Q1 de ${MONTHS[state.currentMonth]} ${state.currentYear}</option><option value="q2">Q2 de ${MONTHS[state.currentMonth]} ${state.currentYear}</option><option value="savings">Ahorro general</option></select><p class="text-[11px] text-gray-400 mt-1">Si eliges Q1 o Q2, la liquidación se cargará a esa quincena. Si eliges Ahorro, reducirá tu ahorro acumulado y no tu sueldo libre.</p></div><div class="flex gap-2 pt-2"><button class="flex-1 bg-menta-500 text-white rounded-lg py-2.5 text-sm font-semibold">Confirmar liquidación</button><button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-gray-100 text-sm">Cancelar</button></div></form></div>`;
  document.getElementById('modal').classList.remove('hidden');lucide.createIcons();
}
function saveInstallmentLiquidation(event,id){
  event.preventDefault();const item=(state.installments||[]).find(i=>i.id===id);if(!item)return;
  const fd=new FormData(event.target),source=fd.get('liquidationSource')||'q1',date=fd.get('liquidationDate'),amount=parseFloat(fd.get('liquidationAmount'))||0;
  item.liquidation={confirmed:true,date,amount,source,sourceMonth:state.currentMonth,sourceYear:state.currentYear,createdAt:new Date().toISOString()};
  item.status='pagado';saveState();closeModal();render();
}
function undoInstallmentLiquidation(id){
  const item=(state.installments||[]).find(i=>i.id===id);if(!item||!isInstallmentLiquidated(item))return;
  if(!confirm('¿Quitar la liquidación anticipada y volver a proyectar las cuotas futuras?'))return;
  item.liquidation=null;item.status='pendiente';saveState();render();
}
function toggleInstallmentDetail(id){
  if(expandedInstallments.has(id)) expandedInstallments.delete(id);
  else expandedInstallments.add(id);
  renderInstallmentsView();
  lucide.createIcons();
}
function setInstallmentViewFilter(filter){
  installmentViewFilter=filter||'all';
  renderInstallmentsView();
  lucide.createIcons();
}
function setInstallmentViewSearch(value){
  installmentViewSearch=String(value||'').toLowerCase().trim();
  renderInstallmentsView();
  lucide.createIcons();
}
function setInstallmentViewSort(value){
  installmentViewSort=value||'remaining-desc';
  renderInstallmentsView();
  lucide.createIcons();
}
function toggleAllInstallmentDetails(open){
  const items=state.installments||[];
  if(open) items.forEach(i=>expandedInstallments.add(i.id));

  lucide.createIcons();
}
function renderInstallmentsView(){
  const items=state.installments||[];
  const activeThisMonth=items.filter(i=>isInstallmentRelevantInMonth(i,state.currentMonth,state.currentYear)&&getInstallmentRemainingAmount(i)>0&&!isInstallmentLiquidated(i));
  const ongoing=items.filter(i=>getInstallmentRemainingAmount(i)>0&&!isInstallmentLiquidated(i));
  const finished=items.filter(i=>isInstallmentLiquidated(i)||getInstallmentRemainingAmount(i)<=0);
  const totalDebt=items.reduce((s,i)=>s+(parseFloat(i.totalAmount)||0),0);
  const activeMonthly=activeThisMonth.reduce((s,i)=>s+(getPaymentPlan(i)==='Dividir en varias quincenas de pago'?(getInstallmentPaymentTarget(i,1,state.currentMonth,state.currentYear)?.amount||0)+(getInstallmentPaymentTarget(i,2,state.currentMonth,state.currentYear)?.amount||0):(parseFloat(i.amount)||0)),0);

  let visibleItems=items.filter(item=>{
    const liquidated=isInstallmentLiquidated(item);
    const remaining=getInstallmentRemainingAmount(item);
    const activeNow=isInstallmentRelevantInMonth(item,state.currentMonth,state.currentYear);
    if(installmentViewFilter==='ongoing' && !(remaining>0&&!liquidated)) return false;
    if(installmentViewFilter==='month' && !(activeNow&&remaining>0&&!liquidated)) return false;
    if(installmentViewFilter==='done' && !(liquidated||remaining<=0)) return false;

    }
    return true;
  });

  const sorters={
    'remaining-desc':(a,b)=>getInstallmentRemainingAmount(b)-getInstallmentRemainingAmount(a),
    'monthly-desc':(a,b)=>(parseFloat(b.amount)||0)-(parseFloat(a.amount)||0),
    'progress-asc':(a,b)=>{const at=parseFloat(a.totalAmount)||0,bt=parseFloat(b.totalAmount)||0;const ap=at?getInstallmentPaidAmount(a)/at:1,bp=bt?getInstallmentPaidAmount(b)/bt:1;return ap-bp;},
    'progress-desc':(a,b)=>{const at=parseFloat(a.totalAmount)||0,bt=parseFloat(b.totalAmount)||0;const ap=at?getInstallmentPaidAmount(a)/at:1,bp=bt?getInstallmentPaidAmount(b)/bt:1;return bp-ap;},
    'name':(a,b)=>String(a.concept||'').localeCompare(String(b.concept||''),'es')
  };
  visibleItems=[...visibleItems].sort(sorters[installmentViewSort]||sorters['remaining-desc']);

  const itemCard=item=>{

    const activeNow=isInstallmentRelevantInMonth(item,state.currentMonth,state.currentYear),current=Math.max(0,Math.min(totalMonths,getInstallmentNumberForMonth(item,state.currentMonth,state.currentYear)));

    const progressLabel=quotaTargets.length?`${Math.min(paidQuotaCount,quotaTargets.length)}/${quotaTargets.length}`:activeNow?`${current}/${totalMonths}`:`0/${totalMonths}`;
    const progressPct=total>0?Math.min(100,Math.round((paidProjected/total)*100)):0;
    const monthsRemaining=liquidated?0:(quotaTargets.length?Math.max(0,quotaTargets.length-paidQuotaCount):Math.max(0,totalMonths-current));
    const isFinished=liquidated||remaining<=0;
    const statusText=isFinished?'Finalizada':activeNow?`${statusVisual.label} · ${progressLabel}`:'Fuera del mes';
    const statusCls=isFinished?'bg-menta-50 border-menta-100 text-menta-600':activeNow?`${statusVisual.bg} ${statusVisual.border} ${statusVisual.text}`:'bg-gray-50 border-gray-100 text-gray-400';
    const qAmount=parseFloat(item.quincenaAmount)||monthly/2;
    const liquidationBlock=liquidated?`<div class="mb-3 rounded-xl bg-menta-50 border border-menta-100 p-3 flex items-center justify-between gap-3"><div><div class="text-xs font-bold text-menta-600">✓ Liquidada anticipadamente</div><div class="text-[10px] text-gray-500 mt-0.5">${formatShortDate(item.liquidation.date)} · ${fmt(item.liquidation.amount)} · ${item.liquidation.source==='savings'?'Ahorro general':item.liquidation.source.toUpperCase()+' '+MONTHS[item.liquidation.sourceMonth]}</div></div><button onclick="undoInstallmentLiquidation('${item.id}')" class="text-[10px] px-2 py-1 rounded-lg bg-white text-gray-500 border border-gray-100">Deshacer</button></div>`:'';

    return `<article class="bg-white rounded-2xl card-shadow border ${isOpen?'border-lila-200 ring-1 ring-lila-50':isFinished?'border-menta-100':'border-gray-100'} overflow-hidden transition-all duration-200">

              <h3 class="text-[15px] font-extrabold text-gray-800 truncate">${escapeHtml(item.concept||'Pago a meses')}</h3>

          <div class="bg-white border border-gray-100 rounded-lg p-2"><div class="text-[9px] text-gray-400">Pago Q</div><div class="text-xs font-bold text-lila-500">${fmt(qAmount)}</div></div>

function renderAnnualView(){

  if(!extras.otherName) extras.otherName='Otro extra';
  const extraEstimated=(parseFloat(extras.bonusEstimated)||0)+(parseFloat(extras.savingsFundEstimated)||0)+(parseFloat(extras.otherEstimated)||0);
  const extraReal=(parseFloat(extras.bonusReal)||0)+(parseFloat(extras.savingsFundReal)||0)+(parseFloat(extras.otherReal)||0);
  const extraDiff=extraReal-extraEstimated;
  const incomeAnnual=data.reduce((s,d)=>s+d.income,0);
  const fixedAnnual=data.reduce((s,d)=>s+d.fixed,0);
  const instAnnual=data.reduce((s,d)=>s+d.inst,0);
  const variAnnual=data.reduce((s,d)=>s+d.vari,0);
  const savingsAnnual=data.reduce((s,d)=>s+d.sav,0);
  const paymentsAnnual=fixedAnnual+instAnnual+variAnnual;
  const outAnnual=paymentsAnnual+savingsAnnual;

function syncInstallmentStartFields(form,source='monthly'){
  if(!form)return;
  const monthField=form.querySelector('[name="startMonth"]');
  const yearField=form.querySelector('[name="startYear"]');
  const bm=form.querySelector('[name="startMonthBiweekly"]');
  const by=form.querySelector('[name="startYearBiweekly"]');
  if(source==='biweekly'){
    if(monthField&&bm)monthField.value=bm.value;
    if(yearField&&by)yearField.value=by.value;
  }else{
    if(bm&&monthField)bm.value=monthField.value;
    if(by&&yearField)by.value=yearField.value;
  }
  updateInstallmentProgressiveForm(form);
}

function updateInstallmentProgressiveForm(form){
  if(!form)return;

  const paymentMode=form.querySelector('[name="paymentMode"]:checked')?.value||'monthly';
  const apartMode=form.querySelector('[name="apartMode"]:checked')?.value||'biweekly';
  const apartQ=parseInt(form.querySelector('[name="apartMonthlyQ"]:checked')?.value)||1;

  form.querySelector('[data-payment-monthly]')?.classList.toggle('hidden',paymentMode!=='monthly');
  form.querySelector('[data-payment-biweekly]')?.classList.toggle('hidden',paymentMode!=='biweekly');
  form.querySelector('[data-apart-monthly]')?.classList.toggle('hidden',apartMode!=='monthly');
  form.querySelector('[data-apart-biweekly]')?.classList.toggle('hidden',apartMode!=='biweekly');
  form.querySelector('[data-apart-sequential]')?.classList.toggle('hidden',!(apartMode==='biweekly'&&paymentMode==='biweekly'));

  // Mantener sincronizados los campos de inicio que usa la lógica existente.
  const startMonth=form.querySelector('[name="startMonth"]');
  const startYear=form.querySelector('[name="startYear"]');
  const bm=form.querySelector('[name="startMonthBiweekly"]');
  const by=form.querySelector('[name="startYearBiweekly"]');
  if(paymentMode==='biweekly'){
    if(startMonth&&bm)startMonth.value=bm.value;
    if(startYear&&by)startYear.value=by.value;
  }

  const paymentPlan=form.querySelector('[name="paymentPlan"]');
  const date=Math.max(1,Math.min(31,parseInt(form.querySelector('[name="date"]')?.value)||1));
  if(paymentPlan){
    paymentPlan.value=paymentMode==='biweekly'
      ? 'Dividir en varias quincenas de pago'
      : (date<=15?'Pagar todo en Q1':'Pagar todo en Q2');
  }

  const apartPlan=form.querySelector('[name="apartPlan"]');
  if(apartPlan){
    if(apartMode==='monthly'){
      apartPlan.value='Apartado mensual';
    }else{
      apartPlan.value=paymentMode==='biweekly'
        ? 'Dividir en varias quincenas de apartado'
        : 'Dividir apartado en Q1 y Q2';
    }
  }

  // Botones Q1/Q2 del apartado mensual.
  form.querySelectorAll('[data-apart-q-button]').forEach(el=>{
    const active=parseInt(el.dataset.apartQButton)===apartQ;
    el.className=`rounded-lg border px-3 py-2 text-center text-xs font-bold ${
      active?'bg-azul-500 text-white border-azul-500':'bg-white text-gray-500 border-gray-200'
    }`;
  });

  const total=parseFloat(form.querySelector('[name="totalAmount"]')?.value)||0;
  const months=Math.max(1,parseInt(form.querySelector('[name="totalMonths"]')?.value)||1);
  const amountField=form.querySelector('[name="amount"]');
  const monthly=parseFloat(amountField?.value)||0;
  const suggested=months>0?total/months:0;

  const suggestionBox=form.querySelector('[data-monthly-suggestion]');
  if(suggestionBox){
    suggestionBox.textContent=total>0 ? `Sugerido por la app: ${fmt(suggested)}` : '';
  }

  const qAmount=parseFloat(form.querySelector('[name="quincenaAmount"]')?.value)||0;
  const effectiveAmount=paymentMode==='monthly'?monthly:(qAmount*2);

  const apartMonthlyAmount=form.querySelector('[data-apart-monthly-amount]');
  if(apartMonthlyAmount)apartMonthlyAmount.textContent=fmt(effectiveAmount);

  const manualQ1Field=form.querySelector('[name="manualQ1"]');
  const manualQ2Field=form.querySelector('[name="manualQ2"]');
  const suggestedSplit=effectiveAmount/2;
  if(manualQ1Field)manualQ1Field.placeholder=`Sugerido ${fmt(suggestedSplit)}`;
  if(manualQ2Field)manualQ2Field.placeholder=`Sugerido ${fmt(suggestedSplit)}`;

  // Resumen.
  const summary=form.querySelector('[data-installment-live-summary]');
  if(summary){
    const concept=form.querySelector('[name="concept"]')?.value?.trim()||'Este gasto';
    let payText='';
    if(paymentMode==='monthly'){
      payText=`${months} ${months===1?'mes':'meses'} · ${fmt(monthly)} al mes · vence el día ${date}`;
    }else{
      const count=Math.max(1,parseInt(form.querySelector('[name="paymentQuincenas"]')?.value)||1);
      const first=form.querySelector('[name="paymentFirstQuincena"]')?.value||'current-q1';
      payText=`${count} ${count===1?'quincena':'quincenas'} · ${fmt(qAmount)} por quincena · desde ${getInstallmentStartOptionLabel(first)}`;
    }

    let apartText='';
    if(apartMode==='monthly'){
      apartText=`apartado mensual: ${fmt(effectiveAmount)}`;
    }else{
      const aq1Raw=parseFloat(form.querySelector('[name="manualQ1"]')?.value)||0;
      const aq2Raw=parseFloat(form.querySelector('[name="manualQ2"]')?.value)||0;
      const aq1=aq1Raw>0?aq1Raw:suggestedSplit;
      const aq2=aq2Raw>0?aq2Raw:suggestedSplit;
      apartText=`apartado por quincenas: Q1 ${fmt(aq1)} · Q2 ${fmt(aq2)}`;
    }
    summary.innerHTML=`<b class="text-gray-700">${escapeHtml(concept)}</b> · ${payText}<br><span class="text-azul-500 font-semibold">${apartText}</span>`;
  }

  // Re-render de calendario de cuotas en modo quincenal.
  if(paymentMode==='biweekly')renderPaymentSchedulePreview(form);
  else{
    const preview=form.querySelector('[data-payment-schedule-preview]');
    if(preview){ preview.innerHTML=''; preview.classList.add('hidden'); }
  }

  // Volver a pintar los dos botones principales sin perder selección.
  const paintGroup=(name,color)=>{
    form.querySelectorAll(`input[name="${name}"]`).forEach(inp=>{
      const box=inp.nextElementSibling;
      if(!box)return;
      const active=inp.checked;
      box.className=`rounded-xl border px-3 py-2.5 flex items-center gap-2 transition ${
        active
          ? color==='menta'
            ? 'bg-menta-50 border-menta-200 text-menta-600 ring-1 ring-menta-100'
            : 'bg-azul-50 border-azul-200 text-azul-600 ring-1 ring-azul-100'
          : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'
      }`;
    });
  };
  paintGroup('paymentMode','menta');
  paintGroup('apartMode','azul');

  lucide.createIcons();
}



function getFixedProgressiveMode(item){
  const paymentPlan=getPaymentPlan(item||{});
  const apartPlan=getApartPlan(item||{});
  return {
    paymentMode: paymentPlan==='Pagar mitad en Q1 y mitad en Q2' ? 'biweekly' : 'monthly',
    apartMode: (apartPlan==='Apartado mensual'||apartPlan==='Apartar todo en Q1'||apartPlan==='Apartar todo en Q2') ? 'monthly' : 'biweekly',
    apartQ: apartPlan==='Apartar todo en Q2' ? 2 : 1
  };
}

function fixedChoiceButton(name,value,current,label,icon,color){
  const active=String(value)===String(current);
  const activeCls=color==='lila'
    ? 'bg-lila-50 border-lila-200 text-lila-600 ring-1 ring-lila-100'
    : 'bg-azul-50 border-azul-200 text-azul-600 ring-1 ring-azul-100';
  return `<label class="cursor-pointer flex-1">
    <input type="radio" name="${name}" value="${value}" ${active?'checked':''} onchange="updateFixedProgressiveForm(this.form)" class="sr-only">
    <div class="rounded-xl border px-3 py-2.5 flex items-center gap-2 transition ${active?activeCls:'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'}">
      <i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i>
      <span class="text-xs font-bold">${label}</span>
    </div>
  </label>`;
}

function updateFixedProgressiveForm(form){
  if(!form)return;

  const paymentMode=form.querySelector('[name="fixedPaymentMode"]:checked')?.value||'monthly';
  const apartMode=form.querySelector('[name="fixedApartMode"]:checked')?.value||'biweekly';
  const apartQ=parseInt(form.querySelector('[name="fixedApartMonthlyQ"]:checked')?.value)||1;
  const amount=parseFloat(form.querySelector('[name="amount"]')?.value)||0;
  const date=Math.max(1,Math.min(31,parseInt(form.querySelector('[name="date"]')?.value)||1));

  form.querySelector('[data-fixed-payment-monthly]')?.classList.toggle('hidden',paymentMode!=='monthly');
  form.querySelector('[data-fixed-payment-biweekly]')?.classList.toggle('hidden',paymentMode!=='biweekly');
  form.querySelector('[data-fixed-apart-monthly]')?.classList.toggle('hidden',apartMode!=='monthly');
  form.querySelector('[data-fixed-apart-biweekly]')?.classList.toggle('hidden',apartMode!=='biweekly');

  const endWrap=form.querySelector('[data-fixed-end-wrap]');
  if(endWrap)endWrap.classList.toggle('hidden',form.querySelector('[name="hasEndDate"]')?.value!=='yes');

  const paymentPlan=form.querySelector('[name="paymentPlan"]');
  if(paymentPlan){
    paymentPlan.value=paymentMode==='biweekly'
      ? 'Pagar mitad en Q1 y mitad en Q2'
      : (date<=15?'Pagar todo en Q1':'Pagar todo en Q2');
  }

  const apartPlan=form.querySelector('[name="apartPlan"]');
  if(apartPlan){
    apartPlan.value=apartMode==='monthly'
      ? 'Apartado mensual'
      : 'Dividir apartado en Q1 y Q2';
  }

  form.querySelectorAll('[data-fixed-apart-q]').forEach(el=>{
    const active=parseInt(el.dataset.fixedApartQ)===apartQ;
    el.className=`rounded-lg border px-3 py-2 text-center text-xs font-bold ${active?'bg-azul-500 text-white border-azul-500':'bg-white text-gray-500 border-gray-200'}`;
  });

  const hint=form.querySelector('[data-fixed-payment-q-hint]');
  if(hint)hint.textContent=`Este pago aparecerá en Q${date<=15?1:2}.`;

  const monthlyAmount=form.querySelector('[data-fixed-apart-monthly-amount]');
  if(monthlyAmount)monthlyAmount.textContent=fmt(amount);

  const paintGroup=(name,color)=>{
    form.querySelectorAll(`input[name="${name}"]`).forEach(inp=>{
      const box=inp.nextElementSibling;if(!box)return;
      const active=inp.checked;
      const activeCls=color==='lila'
        ? 'bg-lila-50 border-lila-200 text-lila-600 ring-1 ring-lila-100'
        : 'bg-azul-50 border-azul-200 text-azul-600 ring-1 ring-azul-100';
      box.className=`rounded-xl border px-3 py-2.5 flex items-center gap-2 transition ${active?activeCls:'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'}`;
    });
  };
  paintGroup('fixedPaymentMode','lila');
  paintGroup('fixedApartMode','azul');

  const summary=form.querySelector('[data-fixed-live-summary]');
  if(summary){
    const concept=form.querySelector('[name="concept"]')?.value?.trim()||'Este pago';
    let payText='';
    if(paymentMode==='monthly'){
      payText=`pago mensual de ${fmt(amount)} · día ${date} · Q${date<=15?1:2}`;
    }else{
      const p1=parseFloat(form.querySelector('[name="paymentManualQ1"]')?.value)||0;
      const p2=parseFloat(form.querySelector('[name="paymentManualQ2"]')?.value)||0;
      payText=`pago por quincenas: Q1 ${fmt(p1)} · Q2 ${fmt(p2)}`;
    }

    let apartText='';
    if(apartMode==='monthly'){
      apartText=`apartado mensual: ${fmt(amount)}`;
    }else{
      const a1=parseFloat(form.querySelector('[name="manualQ1"]')?.value)||0;
      const a2=parseFloat(form.querySelector('[name="manualQ2"]')?.value)||0;
      apartText=`apartado por quincenas: Q1 ${fmt(a1)} · Q2 ${fmt(a2)}`;
    }

    const startM=parseInt(form.querySelector('[name="startMonth"]')?.value);
    const startY=parseInt(form.querySelector('[name="startYear"]')?.value)||state.currentYear;
    const hasEnd=form.querySelector('[name="hasEndDate"]')?.value==='yes';
    let period=`desde ${MONTHS[Number.isNaN(startM)?state.currentMonth:startM]} ${startY}`;
    if(hasEnd){
      const em=parseInt(form.querySelector('[name="endMonth"]')?.value);
      const ey=parseInt(form.querySelector('[name="endYear"]')?.value)||startY;
      period+=` hasta ${MONTHS[Number.isNaN(em)?startM:em]} ${ey}`;
    }else period+=' · sin fecha final';

    summary.innerHTML=`<b class="text-gray-700">${escapeHtml(concept)}</b> · ${payText}<br><span class="font-semibold text-azul-500">${apartText}</span> · ${period}`;
  }

  lucide.createIcons();
}



function getVariableProgressiveMode(item){
  const paymentPlan=getPaymentPlan(item||{});
  const apartPlan=getApartPlan(item||{});
  return {
    paymentMode: paymentPlan==='Pagar mitad en Q1 y mitad en Q2' ? 'biweekly' : 'monthly',
    apartMode: (apartPlan==='Apartado mensual'||apartPlan==='Apartar todo en Q1'||apartPlan==='Apartar todo en Q2') ? 'monthly' : 'biweekly',
    apartQ: apartPlan==='Apartar todo en Q2' ? 2 : 1
  };
}

function variableChoiceButton(name,value,current,label,icon,color){
  const active=String(value)===String(current);
  const activeCls=color==='durazno'
    ? 'bg-durazno-50 border-durazno-200 text-durazno-600 ring-1 ring-durazno-100'
    : 'bg-azul-50 border-azul-200 text-azul-600 ring-1 ring-azul-100';

  return `<label class="cursor-pointer flex-1">
    <input type="radio" name="${name}" value="${value}" ${active?'checked':''} onchange="updateVariableProgressiveForm(this.form)" class="sr-only">
    <div class="rounded-xl border px-3 py-2.5 flex items-center gap-2 transition ${active?activeCls:'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'}">
      <i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i>
      <span class="text-xs font-bold">${label}</span>
    </div>
  </label>`;
}

function updateVariableProgressiveForm(form){
  if(!form)return;

  const paymentMode=form.querySelector('[name="variablePaymentMode"]:checked')?.value||'monthly';
  const apartMode=form.querySelector('[name="variableApartMode"]:checked')?.value||'biweekly';
  const apartQ=parseInt(form.querySelector('[name="variableApartMonthlyQ"]:checked')?.value)||1;
  const amount=parseFloat(form.querySelector('[name="amount"]')?.value)||0;
  const estimated=parseFloat(form.querySelector('[name="estimatedAmount"]')?.value)||0;
  const date=Math.max(1,Math.min(31,parseInt(form.querySelector('[name="date"]')?.value)||1));

  form.querySelector('[data-variable-payment-monthly]')?.classList.toggle('hidden',paymentMode!=='monthly');
  form.querySelector('[data-variable-payment-biweekly]')?.classList.toggle('hidden',paymentMode!=='biweekly');
  form.querySelector('[data-variable-apart-monthly]')?.classList.toggle('hidden',apartMode!=='monthly');
  form.querySelector('[data-variable-apart-biweekly]')?.classList.toggle('hidden',apartMode!=='biweekly');

  const paymentPlan=form.querySelector('[name="paymentPlan"]');
  if(paymentPlan){
    paymentPlan.value=paymentMode==='biweekly'
      ? 'Pagar mitad en Q1 y mitad en Q2'
      : (date<=15?'Pagar todo en Q1':'Pagar todo en Q2');
  }

  const apartPlan=form.querySelector('[name="apartPlan"]');
  if(apartPlan){
    apartPlan.value=apartMode==='monthly'
      ? 'Apartado mensual'
      : 'Dividir apartado en Q1 y Q2';
  }

  form.querySelectorAll('[data-variable-apart-q]').forEach(el=>{
    const active=parseInt(el.dataset.variableApartQ)===apartQ;
    el.className=`rounded-lg border px-3 py-2 text-center text-xs font-bold ${active?'bg-azul-500 text-white border-azul-500':'bg-white text-gray-500 border-gray-200'}`;
  });

  const hint=form.querySelector('[data-variable-payment-q-hint]');
  if(hint)hint.textContent=`Este pago aparecerá en Q${date<=15?1:2}.`;

  const monthlyAmount=form.querySelector('[data-variable-apart-monthly-amount]');
  if(monthlyAmount)monthlyAmount.textContent=fmt(amount);

  const paintGroup=(name,color)=>{
    form.querySelectorAll(`input[name="${name}"]`).forEach(inp=>{
      const box=inp.nextElementSibling;
      if(!box)return;
      const active=inp.checked;
      const activeCls=color==='durazno'
        ? 'bg-durazno-50 border-durazno-200 text-durazno-600 ring-1 ring-durazno-100'
        : 'bg-azul-50 border-azul-200 text-azul-600 ring-1 ring-azul-100';

      box.className=`rounded-xl border px-3 py-2.5 flex items-center gap-2 transition ${active?activeCls:'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'}`;
    });
  };

  paintGroup('variablePaymentMode','durazno');
  paintGroup('variableApartMode','azul');

  const summary=form.querySelector('[data-variable-live-summary]');
  if(summary){
    const concept=form.querySelector('[name="concept"]')?.value?.trim()||'Este gasto';
    const month=parseInt(form.querySelector('[name="variableMonth"]')?.value);
    const year=parseInt(form.querySelector('[name="variableYear"]')?.value)||state.currentYear;

    let payText='';
    if(paymentMode==='monthly'){
      payText=`pago completo de ${fmt(amount)} · día ${date} · Q${date<=15?1:2}`;
    }else{
      const p1=parseFloat(form.querySelector('[name="paymentManualQ1"]')?.value)||0;
      const p2=parseFloat(form.querySelector('[name="paymentManualQ2"]')?.value)||0;
      payText=`pago por quincenas: Q1 ${fmt(p1)} · Q2 ${fmt(p2)}`;
    }

    let apartText='';
    if(apartMode==='monthly'){
      apartText=`apartado mensual: ${fmt(amount)}`;
    }else{
      const a1=parseFloat(form.querySelector('[name="manualQ1"]')?.value)||0;
      const a2=parseFloat(form.querySelector('[name="manualQ2"]')?.value)||0;
      apartText=`apartado por quincenas: Q1 ${fmt(a1)} · Q2 ${fmt(a2)}`;
    }

    const diff=estimated-amount;
    const diffText=estimated>0
      ? ` · ${diff>=0?`${fmt(diff)} debajo del estimado`:`${fmt(Math.abs(diff))} arriba del estimado`}`
      : '';

    summary.innerHTML=`<b class="text-gray-700">${escapeHtml(concept)}</b> · ${MONTHS[Number.isNaN(month)?state.currentMonth:month]} ${year}<br>${payText}${diffText}<br><span class="font-semibold text-azul-500">${apartText}</span>`;
  }

  lucide.createIcons();
}

function toggleEndDateFields(v){const el=document.getElementById('endDateFields');if(el)el.classList.toggle('hidden',v!=='yes');}
function buildPaymentScheduleFromForm(form){
  if(!form||form.dataset.recordType!=='installment')return [];
  const count=Math.max(1,parseInt(form.querySelector('[name="paymentQuincenas"]')?.value)||2);
  const temp={startMonth:parseInt(form.querySelector('[name="startMonth"]')?.value)||0,startYear:parseInt(form.querySelector('[name="startYear"]')?.value)||state.currentYear,paymentFirstQuincena:form.querySelector('[name="paymentFirstQuincena"]')?.value||'current-q1',paymentQuincenas:count};
  const targets=getSequentialQuincenaTargets(temp,'payment');
  const item=(state.installments||[]).find(i=>i.id===form.dataset.itemId);
  const saved=Array.isArray(item?.paymentSchedule)?item.paymentSchedule:[];
  const amount=parseFloat(form.querySelector('[name="quincenaAmount"]')?.value)||0;
  return targets.map((t,i)=>{
    const existing=saved.find(s=>parseInt(s.index)===i+1)||saved[i]||{};
    const defaultDay=t.q===1?(parseInt(item?.paymentDayQ1)||parseInt(item?.date)||1):(parseInt(item?.paymentDayQ2)||parseInt(item?.date)||16);
    const safe=Math.max(1,Math.min(defaultDay,getDaysInMonth(t.month,t.year)));
    const dateInput=form.querySelector(`[name="paymentScheduleDate_${i}"]`);
    const amountInput=form.querySelector(`[name="paymentScheduleAmount_${i}"]`);
    return {index:i+1,month:t.month,year:t.year,q:t.q,date:dateInput?.value||existing.date||isoDate(t.year,t.month,safe),amount:parseFloat(amountInput?.value)||parseFloat(existing.amount)||amount};
  });
}

  const box=form?.querySelector('[data-payment-schedule-preview]');if(!box)return;

  if(payment!=='Dividir en varias quincenas de pago'){box.innerHTML='';box.classList.add('hidden');return;}

  const schedule=buildPaymentScheduleFromForm(form);

}
function updatePlanFieldsPreview(form){

function ensureCreditArchitecture(){

      const normName=normalizeCreditText(old.name||old.bank);

      }

    if(a.cutDay===undefined){a.cutDay=1;changed=true;}
    if(a.dueDay===undefined){a.dueDay=parseInt(a.payDay)||1;changed=true;}
    if(a.currentBalance===undefined){a.currentBalance=null;changed=true;}
    if(a.balanceDate===undefined){a.balanceDate='';changed=true;}
    if(a.archived===undefined){a.archived=false;changed=true;}
    if(a.paymentAccountId===undefined){a.paymentAccountId='';changed=true;}
  });

  // Migra referencias antiguas por nombre a IDs sin modificar lo que ve la usuaria.
  (state.fixed||[]).forEach(i=>{if(!i.cardAccountId){const id=resolveAccountIdByReference(i.card);if(id){i.cardAccountId=id;changed=true;}}});
  (state.variable||[]).forEach(i=>{if(!i.cardAccountId){const id=resolveAccountIdByReference(i.card);if(id){i.cardAccountId=id;changed=true;}}});
  (state.installments||[]).forEach(i=>{

    if(m.accountId&&!m.cardId){m.cardId=creditCardIdForAccount(m.accountId);changed=true;}

function getCreditSetAsideAmounts(mv,m=state.currentMonth,y=state.currentYear){

function getCreditOwnSetAsideAmounts(mv,m=state.currentMonth,y=state.currentYear){

function saveRenameCreditPerson(event,encodedOld){

function saveEditedCreditReceipt(event,id){event.preventDefault();const r=getCreditReceipts().find(x=>x.id===id);if(!r)return;const fd=new FormData(event.target),amount=parseFloat(fd.get('amount'))||0,[y,m]=String(fd.get('period')).split('-').map(Number);if(amount<=0)return;r.amount=amount;r.date=fd.get('date')||'';r.notes=fd.get('notes')||'';r.appliesMonth=m;r.appliesYear=y;saveState();closeModal();render();}

function saveCreditBankPayment(event,cardId){event.preventDefault();const card=getCreditCards(true).find(c=>c.id===cardId);if(!card)return;const fd=new FormData(event.target),amount=parseFloat(fd.get('amount'))||0;if(amount<=0)return;state.creditBankPayments.push({id:uid(),accountId:card.accountId,amount,date:fd.get('date')||'',notes:fd.get('notes')||'',appliesMonth:state.currentMonth,appliesYear:state.currentYear});saveState();closeModal();render();}
function deleteCreditBankPayment(id){state.creditBankPayments=(state.creditBankPayments||[]).filter(p=>p.id!==id);saveState();closeModal();render();}
function deleteCreditMovement(id){const mv=getCreditMovements().find(m=>m.id===id);if(!mv)return;if(!confirm(`¿Eliminar "${mv.concept||'esta compra'}"? También se quitará su registro vinculado del presupuesto.`))return;removeCreditBudgetRecord(mv);state.creditMovements=getCreditMovements().filter(m=>m.id!==id);state.creditReceipts=getCreditReceipts().filter(r=>r.movementId!==id);saveState();render();}
function archiveCreditAccount(accountId){const a=(state.accounts||[]).find(x=>x.id===accountId);if(!a)return;const card=getCreditCards(true).find(c=>c.accountId===accountId),sum=card?getCreditCardSummary(card):null;if(sum&&((parseFloat(a.currentBalance)||0)>0||sum.explained>0.009||sum.bankPending>0.009||sum.toCollect>0.009)){alert('Esta tarjeta todavía tiene saldo o movimientos pendientes. Déjala activa hasta terminar de conciliarla.');return;}if(!confirm(`¿Archivar ${a.name||'esta tarjeta'}? Se conservará todo su historial.`))return;a.archived=true;saveState();currentView='creditcards';render();}


function migrateLegacyReceivablesToCredit(){
  if(!Array.isArray(state.receivables))return;
  let changed=false;
  state.receivables.forEach(r=>{
    if(r.migratedToCredit)return;
    const accountId=resolveAccountIdByReference(r.account);
    const account=(state.accounts||[]).find(a=>String(a.id)===String(accountId));
    if(!account||!isCreditAccount(account))return;
    let mv=getCreditMovements().find(m=>String(m.sourceReceivableId||'')===String(r.id));
    if(!mv){
      mv={id:uid(),sourceReceivableId:r.id,cardId:creditCardIdForAccount(account.id),accountId:account.id,ownerType:'other',person:r.person||'Otra persona',concept:r.concept||'Compra de tercero',purchaseDate:'',purchaseType:'single',totalAmount:Number(r.amount)||0,months:1,monthlyAmount:Number(r.amount)||0,startMonth:parseInt(r.month),startYear:parseInt(r.year)||state.currentYear,notes:'Migrado desde Cobros de terceros',monthlyStatus:{}};
      if(Number.isNaN(mv.startMonth))mv.startMonth=state.currentMonth;
      state.creditMovements.push(mv);changed=true;
    }
    if(r.collected&&!getCreditReceipts().some(x=>String(x.movementId)===String(mv.id)&&parseInt(x.appliesMonth)===parseInt(mv.startMonth)&&parseInt(x.appliesYear)===parseInt(mv.startYear))){
      state.creditReceipts.push({id:uid(),movementId:mv.id,accountId:account.id,person:mv.person,amount:Number(r.amount)||0,date:'',notes:'Cobrado antes de migrar',appliesMonth:mv.startMonth,appliesYear:mv.startYear});changed=true;
    }
    r.migratedToCredit=mv.id;changed=true;
  });
  if(changed)saveState();
}
function getDashboardReceivableSummary(m=state.currentMonth,y=state.currentYear){
  const legacy=getReceivablesForMonth(m,y).filter(r=>!r.collected&&!r.migratedToCredit);
  const credit=getCreditPeopleMonthlySummary(m,y,'General');
  const creditOpen=credit.rows.filter(r=>r.pending>0.009);
  return {count:legacy.length+creditOpen.length,amount:legacy.reduce((s,r)=>s+(Number(r.amount)||0),0)+credit.missing};
}
function openThirdPartyControl(){
  const legacy=getReceivablesForMonth(state.currentMonth,state.currentYear).filter(r=>!r.migratedToCredit);
  if(legacy.length){openReceivablesModal();return;}
  currentView='creditPeople';render();
}

function updateConfig(k,v){state.config[k]=parseFloat(v)||0;state.config.salaryMonthly=(state.config.salaryBiweekly||0)*2;saveState();render();}
function updatePayrollOverride(q,value){
  if(!state.config.payrollOverrides)state.config.payrollOverrides={};
  const key=payrollOverrideKey();
  if(!state.config.payrollOverrides[key])state.config.payrollOverrides[key]={};
  if(value)state.config.payrollOverrides[key][`q${q}`]=value;
  else delete state.config.payrollOverrides[key][`q${q}`];
  saveState();render();
}

function savePayrollMonthForm(event){
  event.preventDefault();

function updatePayrollOverrideSilent(q,value){
  if(!state.config.payrollOverrides)state.config.payrollOverrides={};
  const key=payrollOverrideKey();
  if(!state.config.payrollOverrides[key])state.config.payrollOverrides[key]={};
  if(value)state.config.payrollOverrides[key][`q${q}`]=value;
  else delete state.config.payrollOverrides[key][`q${q}`];
}
function getSavingsGoalMonthsInYear(year=state.currentYear){
  const sm=parseInt(state.config.savingsStartMonth)||0;
  const sy=parseInt(state.config.savingsStartYear)||year;
  if(year<sy)return 0;
  if(year>sy)return 12;
  return Math.max(0,12-sm);
}
function getAnnualSavingsGoalStats(year=state.currentYear){
  const monthly=parseFloat(state.config.savingsGoal)||0;
  const biweekly=monthly/2;
  const activeMonths=getSavingsGoalMonthsInYear(year);
  const estimated=monthly*activeMonths;
  const real=(state.savings||[]).filter(s=>s.year===year&&!s.goalId&&isSavingConfirmed(s)).reduce((sum,s)=>sum+getSavingRealAmount(s),0);
  const planned=(state.savings||[]).filter(s=>s.year===year&&!s.goalId&&!isSavingConfirmed(s)).reduce((sum,s)=>sum+getSavingPlannedAmount(s),0);
  const diff=real-estimated;
  return {monthly,biweekly,activeMonths,estimated,real,planned,diff,missing:Math.max(0,estimated-real)};
}
function getGoalAnnualStats(goal,year=state.currentYear){
  const start=monthIndex(goal.startMonth??0,goal.startYear??year);
  const end=monthIndex(goal.endMonth??goal.startMonth??0,goal.endYear??goal.startYear??year);
  const yStart=monthIndex(0,year), yEnd=monthIndex(11,year);
  const overlapStart=Math.max(start,yStart), overlapEnd=Math.min(end,yEnd);
  const activeMonths=overlapEnd>=overlapStart?(overlapEnd-overlapStart+1):0;
  const totalMonths=Math.max(1,end-start+1);
  const objective=parseFloat(goal.amount)||0;
  const monthlyTarget=objective/totalMonths;
  const estimated=monthlyTarget*activeMonths;
  const real=(state.savings||[]).filter(s=>s.year===year&&s.goalId===goal.id&&isSavingConfirmed(s)).reduce((sum,s)=>sum+getSavingRealAmount(s),0);
  const planned=(state.savings||[]).filter(s=>s.year===year&&s.goalId===goal.id&&!isSavingConfirmed(s)).reduce((sum,s)=>sum+getSavingPlannedAmount(s),0);
  const diff=real-estimated;
  const pct=estimated?Math.round((real/estimated)*100):0;
  return {objective,monthlyTarget,activeMonths,estimated,real,planned,diff,missing:Math.max(0,estimated-real),pct};
}

    <div class="flex items-start justify-between gap-3 mb-4">
      <div>
        <h3 class="font-bold text-gray-800 flex items-center gap-2"><i data-lucide="piggy-bank" class="w-5 h-5 text-azul-500"></i>Resumen anual de ahorro</h3>

      <div class="flex items-start justify-between gap-3 mb-3">
        <div><h4 class="font-bold text-gray-800">Ahorro general</h4><p class="text-xs text-gray-400">Solo registros guardados como General. No mezcla metas extra.</p></div>
        <span class="text-[10px] px-2 py-0.5 rounded-full ${st.diff>=0?'bg-menta-50 text-menta-500 border-menta-100':'bg-durazno-50 text-durazno-500 border-durazno-100'} border">${st.diff>=0?'Arriba de meta':'Debajo de meta'}</span>

function exportBackup(){
  const payload={
    app:'Mi plan de pagos',
    version:'1.0',
    exportedAt:new Date().toISOString(),
    data:state
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const date=new Date().toISOString().slice(0,10);
  a.href=url;
  a.download=`mi-plan-de-pagos-respaldo-${date}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importBackup(event){
  const file=event.target.files&&event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      const imported=parsed.data||parsed;
      if(!imported||typeof imported!=='object'||!imported.config){alert('El archivo no parece ser un respaldo válido de Mi plan de pagos.');return;}
      if(!confirm('¿Importar este respaldo? Esto reemplazará la información actual de la app en este navegador.'))return;
      state=imported;
      if(!state.config.yearEndExtras) state.config.yearEndExtras={bonusEstimated:0,bonusReal:0,savingsFundEstimated:0,savingsFundReal:0,otherName:'Otro extra',otherEstimated:0,otherReal:0,notes:''};
      if(!state.config.yearEndExtras.otherName) state.config.yearEndExtras.otherName='Otro extra';
      if(!state.savingsGoals||!Array.isArray(state.savingsGoals)) state.savingsGoals=[];
      if(!state.monthNotes||typeof state.monthNotes!=='object') state.monthNotes={};
      if(!Array.isArray(state.fixed)) state.fixed=[];
      if(!Array.isArray(state.installments)) state.installments=[];
      if(!Array.isArray(state.variable)) state.variable=[];
      if(!Array.isArray(state.savings)) state.savings=[];
      if(!Array.isArray(state.receivables)) state.receivables=[];
      if(!Array.isArray(state.creditCards)) state.creditCards=[];
      if(!Array.isArray(state.creditMovements)) state.creditMovements=[];
      if(!Array.isArray(state.creditReceipts)) state.creditReceipts=[];
      if(!Array.isArray(state.creditBankPayments)) state.creditBankPayments=[];
      if(!Array.isArray(state.accounts)) state.accounts=[];
      if(!Array.isArray(state.customBanks)) state.customBanks=[];
      if(!state.categories||!Array.isArray(state.categories)) state.categories=[...DEFAULT_CATEGORIES];
      ensureCreditArchitecture();migrateLegacyReceivablesToCredit();
      saveState();
      alert('Respaldo importado correctamente.');
      render();
    }catch(err){
      alert('No se pudo importar el archivo. Revisa que sea un .json válido.');
    }finally{
      event.target.value='';
    }
  };
  reader.readAsText(file);
}

function previewCustomBankImage(input){
  const file=input?.files?.[0];if(!file)return;
  if(!file.type.startsWith('image/')){alert('Selecciona una imagen válida.');return;}
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const W=720,H=260,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
      const ctx=canvas.getContext('2d');
      const ratio=Math.max(W/img.width,H/img.height),dw=img.width*ratio,dh=img.height*ratio;
      ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
      ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
      pendingCustomBankImage=canvas.toDataURL('image/webp',0.80);
      const preview=document.getElementById('customBankPreview');
      if(preview)preview.innerHTML=`<img src="${pendingCustomBankImage}" alt="Vista previa" class="w-full h-full object-cover">`;
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

function getCreditMovementByIdV167(id){return getCreditMovements().find(m=>String(m.id)===String(id))||null;}

function getCreditCardMonthCompositionV167(card,m=state.currentMonth,y=state.currentYear){

}

function getCreditPersonMovementRowStatusV168(mv){
